# NUHRS — Nepal Unified Health Record System
#
# Topology:
#   national-platform (8000)  -> federated exchange, metadata only
#   mediciti-hospital (8003)  -> Nepal Mediciti, standalone edge service (HOSP001)
#   norvic-hospital (8004)    -> Norvic International, variant-B standalone (HOSP002)
#   central-diagnostic-lab (9001) -> Central Diagnostic Lab, variant A (PostgreSQL)
#   pathlabs-nepal (9002)         -> Pathlabs Nepal, variant B (MySQL)
#
# Each service has its OWN database (data sovereignty) — a mix of PostgreSQL and
# MySQL, proving the FHIR adapter is storage-engine agnostic. The platform never
# stores clinical data — it only indexes pointers and routes fetches.

services:
  # ---------------------------------------------------------------- databases
  db-national:
    image: postgres:16
    environment:
      POSTGRES_DB: national_db
      POSTGRES_USER: nuhrs
      POSTGRES_PASSWORD: nuhrs
    ports: ["5437:5432"] # host 5437 (5432 is taken by a local Postgres) -> pgAdmin: localhost:5437
    volumes: ["national_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuhrs"]
      interval: 5s
      retries: 10

  db-lab-a:
    image: postgres:16
    environment:
      POSTGRES_DB: lab_a_db
      POSTGRES_USER: nuhrs
      POSTGRES_PASSWORD: nuhrs
    ports: ["5435:5432"] # host 5435 -> pgAdmin: localhost:5435
    volumes: ["lab_a_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuhrs"]
      interval: 5s
      retries: 10

  # Pathlabs Nepal runs on MySQL (not PostgreSQL) to demonstrate that the FHIR
  # adapter is database-engine agnostic: the National Platform fetches identical
  # HL7 FHIR R4 whether the lab stores its data in Postgres or MySQL.
  db-lab-b:
    image: mysql:8
    environment:
      MYSQL_DATABASE: lab_b_db
      MYSQL_USER: nuhrs
      MYSQL_PASSWORD: nuhrs
      MYSQL_ROOT_PASSWORD: nuhrs
    ports: ["3307:3306"] # host 3307 (3306 is taken by a local MySQL) -> DBeaver/Workbench: localhost:3307
    volumes: ["lab_b_mysql:/var/lib/mysql"]
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unuhrs", "-pnuhrs"]
      interval: 5s
      retries: 15

  db-swastha:
    image: postgres:16
    environment:
      POSTGRES_DB: swastha_db
      POSTGRES_USER: nuhrs
      POSTGRES_PASSWORD: nuhrs
    ports: ["5436:5432"] # host 5436 -> pgAdmin: localhost:5436
    volumes: ["swastha_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuhrs"]
      interval: 5s
      retries: 10

  # Dedicated DB for the standalone Nepal Mediciti edge service (self-contained,
  # Mediciti-only schema — no shared superset with any other hospital).
  db-mediciti:
    image: postgres:16
    environment:
      POSTGRES_DB: mediciti_db
      POSTGRES_USER: nuhrs
      POSTGRES_PASSWORD: nuhrs
    ports: ["5438:5432"] # host 5438 -> pgAdmin: localhost:5438
    volumes: ["mediciti_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuhrs"]
      interval: 5s
      retries: 10

  # Dedicated DB for the standalone Norvic edge service (self-contained,
  # Norvic-only "variant B" schema — different column names + extra services).
  db-norvic:
    image: postgres:16
    environment:
      POSTGRES_DB: norvic_db
      POSTGRES_USER: nuhrs
      POSTGRES_PASSWORD: nuhrs
    ports: ["5439:5432"] # host 5439 -> pgAdmin: localhost:5439
    volumes: ["norvic_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuhrs"]
      interval: 5s
      retries: 10

  # --------------------------------------------------------------- platform
  # NUHRS_PORTAL_URL is the browser-facing origin of the React portal (host
  # port 3000); the SSO exchange endpoint uses it to build the redirect URL.
  national-platform:
    build: ./national-platform

    environment:
      DEBUG: "True"
      DB_HOST: db-national
      DB_NAME: national_db
      DB_USER: nuhrs
      DB_PASSWORD: nuhrs
      NUHRS_PORTAL_URL: "http://localhost:3000"
    ports: ["8000:8000"]

    depends_on:
      db-national:
        condition: service_healthy

  # --------------------------------------------------------------- hospitals
  # Standalone Nepal Mediciti edge service (self-contained, Mediciti-only schema).
  # The federation's HOSP001 data source, built from its own dedicated codebase
  # with no shared multi-hospital superset. Exposes read-only FHIR on port 8003.
  mediciti-hospital:
    build: ./mediciti-hospital
    environment:
      ORG_NAME: "Nepal Mediciti Hospital"
      ORG_CODE: "HOSP001"
      ORG_API_KEY: "mediciti-demo-key-0001"
      PLATFORM_URL: "http://national-platform:8000"
      PORT: "8003"
      DB_HOST: db-mediciti
      DB_NAME: mediciti_db
      DB_USER: nuhrs
      DB_PASSWORD: nuhrs
    ports: ["8003:8003"]
    depends_on:
      db-mediciti:
        condition: service_healthy
      national-platform:
        condition: service_started

  # Standalone Norvic International edge service (self-contained, "variant B"
  # schema — different column names than Mediciti, plus Immunization & Procedure
  # services Mediciti does not offer). Exposes read-only FHIR on port 8004.
  norvic-hospital:
    build: ./norvic-hospital
    environment:
      ORG_NAME: "Norvic International Hospital"
      ORG_CODE: "HOSP002"
      ORG_API_KEY: "norvic-demo-key-0002"
      PLATFORM_URL: "http://national-platform:8000"
      PORT: "8004"
      DB_HOST: db-norvic
      DB_NAME: norvic_db
      DB_USER: nuhrs
      DB_PASSWORD: nuhrs
    ports: ["8004:8004"]
    depends_on:
      db-norvic:
        condition: service_healthy
      national-platform:
        condition: service_started

  # --------------------------------------------------------------- labs

  # Standalone Central Diagnostic Laboratory edge service (self-contained,
  # variant A schema, PostgreSQL). Emits LOINC-coded FHIR DiagnosticReport +
  # Observation resources. Exposes read-only FHIR on port 9001.
  central-diagnostic-lab:
    build: ./central-diagnostic-lab
    environment:
      ORG_NAME: "Central Diagnostic Laboratory"
      ORG_CODE: "LAB001"
      ORG_API_KEY: "central-demo-key-0003"
      PLATFORM_URL: "http://national-platform:8000"
      PORT: "9001"
      DB_HOST: db-lab-a
      DB_NAME: lab_a_db
      DB_USER: nuhrs
      DB_PASSWORD: nuhrs
    ports: ["9001:9001"]
    depends_on:
      db-lab-a:
        condition: service_healthy
      national-platform:
        condition: service_started

  # Standalone Pathlabs Nepal edge service (self-contained, variant B schema,
  # MySQL — different column names than Central Diagnostic). Emits IDENTICAL
  # LOINC-coded FHIR despite the different DB engine + schema. FHIR on port 9002.
  pathlabs-nepal:
    build: ./pathlabs-nepal
    environment:
      ORG_NAME: "Pathlabs Nepal"
      ORG_CODE: "LAB002"
      ORG_API_KEY: "pathlabs-demo-key-0004"
      PLATFORM_URL: "http://national-platform:8000"
      PORT: "9002"
      DB_HOST: db-lab-b
      DB_PORT: "3306"
      DB_NAME: lab_b_db
      DB_USER: nuhrs
      DB_PASSWORD: nuhrs
    ports: ["9002:9002"]
    depends_on:
      db-lab-b:
        condition: service_healthy
      national-platform:
        condition: service_started

  # --------------------------------------------------------------- swastha ehr
  # Third hospital (HOSP003): standalone SwasthyaEHR app with its own React SPA.
  # Its backend joins the NUHRS federation via the NID-keyed FHIR adapter and
  # pushes record metadata to the national index at startup.
  swastha-backend:
    build: ./swastha-ehr/backend
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,swastha-backend"
      DB_HOST: db-swastha
      DB_NAME: swastha_db
      DB_USER: nuhrs
      DB_PASSWORD: nuhrs
      PORT: "8090"
      NUHRS_ENABLED: "True"
      NUHRS_PLATFORM_URL: "http://national-platform:8000"
      NUHRS_API_KEY: "swastha-demo-key-0005"
      NUHRS_ORG_CODE: "HOSP003"
      CORS_ALLOWED_ORIGINS: "http://localhost:3090,http://127.0.0.1:3090"
    ports: ["8090:8090"]
    depends_on:
      db-swastha:
        condition: service_healthy
      national-platform:
        condition: service_started

  swastha-frontend:
    build: ./swastha-ehr/frontend
    ports: ["3090:80"]
    depends_on:
      swastha-backend:
        condition: service_started

  # --------------------------------------------------------------- frontend
  # React + Vite SPA (modular). The legacy vanilla app remains in ./frontend.
  frontend:
    build:
      context: ./frontend-react
      args:
        VITE_PLATFORM_API: "http://localhost:8000"
    ports: ["3000:80"]
    depends_on:
      national-platform:
        condition: service_started

volumes:
  national_pg:
  lab_a_pg:
  lab_b_mysql:
  swastha_pg:
  mediciti_pg:
  norvic_pg:
