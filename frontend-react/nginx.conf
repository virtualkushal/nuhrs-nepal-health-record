server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy: the SPA calls "/api/..." and nginx forwards it to
    # the national backend container. This keeps the httpOnly JWT cookies
    # (SameSite=Lax) first-party, so no CORS and no cross-site cookie needed.
    # The backend already mounts its API under /api/, so the URI is passed
    # through unchanged (no trailing slash on proxy_pass).
    location /api/ {
        proxy_pass http://national-platform:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: let client-side routing handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
