server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the SwasthyaEHR backend. The SPA uses relative "/api"
    # paths (see src/services/api.js), matching the vite dev proxy behaviour.
    location /api/ {
        proxy_pass http://swastha-backend:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: let client-side routing handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
